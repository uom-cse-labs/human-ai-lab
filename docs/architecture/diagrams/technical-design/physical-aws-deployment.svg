<path class="e" d="M300 168 L370 248" marker-end="url(#ah)"/>
<text class="t-edge" x="340" y="206" text-anchor="start">/api/contact</text>
<path class="e" d="M455 250 L455 182" marker-end="url(#ah)"/>
<text class="t-edge" x="462" y="222" text-anchor="start">SendEmail</text>
<path class="e" d="M710 64 L710 114" marker-end="url(#ah)"/>
<text class="t-edge" x="718" y="94" text-anchor="start">HTTPS</text>
<path class="e" d="M820 148 L888 148" marker-end="url(#ah)"/>
<text class="t-edge" x="854" y="140" text-anchor="middle">PKCE</text>
<path class="e" d="M650 180 L650 248" marker-end="url(#ah)"/>
<text class="t-edge" x="642" y="220" text-anchor="end">/api/* + JWT</text>
<path class="e" d="M800 180 L900 248" marker-end="url(#ah)"/>
<text class="t-edge" x="862" y="206" text-anchor="start">presigned PUT</text>
<path class="e" d="M935 314 L935 408" marker-end="url(#ah)"/>
<text class="t-edge" x="943" y="366" text-anchor="start">S3 event</text>
<path class="e" d="M850 442 L742 442" marker-end="url(#ah)"/>
<text class="t-edge" x="796" y="434" text-anchor="middle">UpdateItem</text>
<path class="e" d="M650 314 L650 408" marker-end="url(#ah)"/>
<text class="t-edge" x="658" y="366" text-anchor="start">read / write</text>
<path class="e" d="M560 306 L362 408" marker-end="url(#ah)"/>
<text class="t-edge" x="470" y="382" text-anchor="start">PutObject + invalidate</text>
<path class="e" d="M935 474 L935 508 L105 508 L105 476" marker-end="url(#ah)"/>
<text class="t-edge" x="520" y="500" text-anchor="middle">PutObject · renditions</text>
