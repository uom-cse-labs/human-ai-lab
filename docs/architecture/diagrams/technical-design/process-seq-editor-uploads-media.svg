<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 682" width="1240" height="682" role="img" aria-label="An editor uploads a video">
<title>An editor uploads a video</title>
<style>
  .n-comp{fill:#ffffff;stroke:#c7cbdc;stroke-width:1.2}
  .n-store{fill:#e9ebf4;stroke:#c7cbdc;stroke-width:1.2}
  .n-person{fill:#eef0f7;stroke:#c7cbdc;stroke-width:1.2}
  .n-ext{fill:#ffffff;stroke:#c7cbdc;stroke-width:1.2;stroke-dasharray:5 4}
  .t-name{fill:#0d0f2b;font:600 13.5px 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif}
  .t-sub{fill:#525a7c;font:400 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-eye{fill:#525a7c;font:500 9.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;letter-spacing:.1em}
  .t-edge{fill:#525a7c;font:500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-edge.path{fill:#0e7686}
  .t-bound{fill:#525a7c;font:500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;letter-spacing:.08em}
  .t-title{fill:#151b54;font:700 17px 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif}
  .t-band{fill:#0d0f2b;font:400 11.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-num{fill:#ffffff;font:600 10px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .e{fill:none;stroke:#525a7c;stroke-width:1.4}
  .e.path{stroke:#0e7686;stroke-width:2}
  .e.ret{stroke-dasharray:5 4}
  .life{stroke:#c7cbdc;stroke-width:1.2;stroke-dasharray:4 5}
  .bound{fill:none;stroke:#151b54;stroke-opacity:.45;stroke-width:1.3;stroke-dasharray:7 5}
  .band{fill:#f3f4fa;stroke:#c7cbdc;stroke-width:1;stroke-dasharray:4 4}
  .note{fill:#e3f3f5;stroke:#0e7686;stroke-width:1}
  .ah{fill:#525a7c} .ah.path{fill:#0e7686}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker>
  <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah path"/></marker>
  <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#ffffff" stroke="#525a7c" stroke-width="1.2"/></marker>
  <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 z" fill="#525a7c"/></marker>
  <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#525a7c" stroke-width="1.4"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1239" height="681" rx="20" fill="#ffffff" stroke="#dfe2ec"/>
<text class="t-title" x="40" y="42" text-anchor="start">An editor uploads a video</text>
<line class="life" x1="110" y1="114" x2="110" y2="624"/>
<rect class="n-person" x="35" y="64" width="150" height="50" rx="25"/>
<text class="t-name" x="110" y="86" text-anchor="middle">Dashboard</text>
<text class="t-sub" x="110" y="102" text-anchor="middle">editor</text>
<line class="life" x1="280" y1="114" x2="280" y2="624"/>
<rect class="n-comp" x="205" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="280" y="86" text-anchor="middle">Content API</text>
<text class="t-sub" x="280" y="102" text-anchor="middle">Java · Lambda</text>
<line class="life" x1="450" y1="114" x2="450" y2="624"/>
<rect class="n-store" x="375" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="450" y="86" text-anchor="middle">DynamoDB</text>
<text class="t-sub" x="450" y="102" text-anchor="middle">content DB</text>
<line class="life" x1="620" y1="114" x2="620" y2="624"/>
<rect class="n-store" x="545" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="620" y="86" text-anchor="middle">S3</text>
<text class="t-sub" x="620" y="102" text-anchor="middle">uploads</text>
<line class="life" x1="790" y1="114" x2="790" y2="624"/>
<rect class="n-comp" x="715" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="790" y="86" text-anchor="middle">Processor</text>
<text class="t-sub" x="790" y="102" text-anchor="middle">Lambda</text>
<line class="life" x1="960" y1="114" x2="960" y2="624"/>
<rect class="n-comp" x="885" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="960" y="86" text-anchor="middle">MediaConvert</text>
<text class="t-sub" x="960" y="102" text-anchor="middle">video jobs</text>
<line class="life" x1="1130" y1="114" x2="1130" y2="624"/>
<rect class="n-store" x="1055" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="1130" y="86" text-anchor="middle">S3</text>
<text class="t-sub" x="1130" y="102" text-anchor="middle">media</text>
<path class="e" d="M110 154 H278" marker-end="url(#ah)"/>
<circle cx="121.6" cy="144" r="9" fill="#525a7c"/>
<text class="t-num" x="121.6" y="147.5" text-anchor="middle">1</text>
<text class="t-edge" x="195" y="148" text-anchor="middle">ask for upload URL</text>
<path class="e" d="M280 198 H448" marker-end="url(#ah)"/>
<circle cx="294.9" cy="188" r="9" fill="#525a7c"/>
<text class="t-num" x="294.9" y="191.5" text-anchor="middle">2</text>
<text class="t-edge" x="365" y="192" text-anchor="middle">create: uploading</text>
<path class="e ret" d="M280 242 H112" marker-end="url(#ah)"/>
<circle cx="134.8" cy="232" r="9" fill="#525a7c"/>
<text class="t-num" x="134.8" y="235.5" text-anchor="middle">3</text>
<text class="t-edge" x="195" y="236" text-anchor="middle">presigned URLs</text>
<path class="e" d="M110 286 H618" marker-end="url(#ah)"/>
<circle cx="252" cy="276" r="9" fill="#525a7c"/>
<text class="t-num" x="252" y="279.5" text-anchor="middle">4</text>
<text class="t-edge" x="365" y="280" text-anchor="middle">PUT parts directly (resumable)</text>
<path class="e" d="M620 330 H788" marker-end="url(#ah)"/>
<circle cx="664.6" cy="320" r="9" fill="#525a7c"/>
<text class="t-num" x="664.6" y="323.5" text-anchor="middle">5</text>
<text class="t-edge" x="705" y="324" text-anchor="middle">S3 event</text>
<rect class="note" x="702" y="354" width="176" height="28" rx="8"/>
<circle cx="718" cy="368" r="9" fill="#0e7686"/>
<text class="t-num" x="718" y="371.5" text-anchor="middle">6</text>
<text class="t-edge path" x="734" y="372" text-anchor="start">check real file type</text>
<path class="e" d="M790 418 H958" marker-end="url(#ah)"/>
<circle cx="831.3" cy="408" r="9" fill="#525a7c"/>
<text class="t-num" x="831.3" y="411.5" text-anchor="middle">7</text>
<text class="t-edge" x="875" y="412" text-anchor="middle">start job</text>
<path class="e" d="M960 462 H1128" marker-end="url(#ah)"/>
<circle cx="961.7" cy="452" r="9" fill="#525a7c"/>
<text class="t-num" x="961.7" y="455.5" text-anchor="middle">8</text>
<text class="t-edge" x="1045" y="456" text-anchor="middle">720p + 1080p + poster</text>
<path class="e ret" d="M960 506 H792" marker-end="url(#ah)"/>
<circle cx="801.6" cy="496" r="9" fill="#525a7c"/>
<text class="t-num" x="801.6" y="499.5" text-anchor="middle">9</text>
<text class="t-edge" x="875" y="500" text-anchor="middle">done (EventBridge)</text>
<path class="e" d="M790 550 H452" marker-end="url(#ah)"/>
<circle cx="573" cy="540" r="9" fill="#525a7c"/>
<text class="t-num" x="573" y="543.5" text-anchor="middle">10</text>
<text class="t-edge" x="620" y="544" text-anchor="middle">mark ready</text>
<path class="e" d="M110 594 H278" marker-end="url(#ah)"/>
<circle cx="138.1" cy="584" r="9" fill="#525a7c"/>
<text class="t-num" x="138.1" y="587.5" text-anchor="middle">11</text>
<text class="t-edge" x="195" y="588" text-anchor="middle">place in slot</text>
<text class="t-edge path" x="40" y="658" text-anchor="start">Files go straight from the browser to S3 and never pass through the API.</text>
</svg>
