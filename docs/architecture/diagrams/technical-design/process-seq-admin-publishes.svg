<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 638" width="1240" height="638" role="img" aria-label="An admin publishes">
<title>An admin publishes</title>
<style>
  .n-comp{fill:#ffffff;stroke:#c7cbdc;stroke-width:1.2}
  .n-store{fill:#e9ebf4;stroke:#c7cbdc;stroke-width:1.2}
  .n-person{fill:#eef0f7;stroke:#c7cbdc;stroke-width:1.2}
  .n-ext{fill:#ffffff;stroke:#c7cbdc;stroke-width:1.2;stroke-dasharray:5 4}
  .t-name{fill:#0d0f2b;font:600 13.5px 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif}
  .t-sub{fill:#525a7c;font:400 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-eye{fill:#525a7c;font:500 9.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;letter-spacing:.1em}
  .t-edge{fill:#525a7c;font:500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-edge.path{fill:#0e7686}
  .t-bound{fill:#525a7c;font:500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;letter-spacing:.08em}
  .t-title{fill:#151b54;font:700 17px 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif}
  .t-band{fill:#0d0f2b;font:400 11.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-num{fill:#ffffff;font:600 10px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .e{fill:none;stroke:#525a7c;stroke-width:1.4}
  .e.path{stroke:#0e7686;stroke-width:2}
  .e.ret{stroke-dasharray:5 4}
  .life{stroke:#c7cbdc;stroke-width:1.2;stroke-dasharray:4 5}
  .bound{fill:none;stroke:#151b54;stroke-opacity:.45;stroke-width:1.3;stroke-dasharray:7 5}
  .band{fill:#f3f4fa;stroke:#c7cbdc;stroke-width:1;stroke-dasharray:4 4}
  .note{fill:#e3f3f5;stroke:#0e7686;stroke-width:1}
  .ah{fill:#525a7c} .ah.path{fill:#0e7686}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker>
  <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah path"/></marker>
  <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#ffffff" stroke="#525a7c" stroke-width="1.2"/></marker>
  <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 z" fill="#525a7c"/></marker>
  <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#525a7c" stroke-width="1.4"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1239" height="637" rx="20" fill="#ffffff" stroke="#dfe2ec"/>
<text class="t-title" x="40" y="42" text-anchor="start">An admin publishes</text>
<line class="life" x1="110" y1="114" x2="110" y2="580"/>
<rect class="n-person" x="35" y="64" width="150" height="50" rx="25"/>
<text class="t-name" x="110" y="86" text-anchor="middle">Dashboard</text>
<text class="t-sub" x="110" y="102" text-anchor="middle">admin</text>
<line class="life" x1="365" y1="114" x2="365" y2="580"/>
<rect class="n-comp" x="290" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="365" y="86" text-anchor="middle">CloudFront</text>
<text class="t-sub" x="365" y="102" text-anchor="middle">WAF · VPC origin</text>
<line class="life" x1="620" y1="114" x2="620" y2="580"/>
<rect class="n-comp" x="545" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="620" y="86" text-anchor="middle">Content API</text>
<text class="t-sub" x="620" y="102" text-anchor="middle">Java · Lambda</text>
<line class="life" x1="875" y1="114" x2="875" y2="580"/>
<rect class="n-store" x="800" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="875" y="86" text-anchor="middle">DynamoDB</text>
<text class="t-sub" x="875" y="102" text-anchor="middle">content DB</text>
<line class="life" x1="1130" y1="114" x2="1130" y2="580"/>
<rect class="n-store" x="1055" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="1130" y="86" text-anchor="middle">S3</text>
<text class="t-sub" x="1130" y="102" text-anchor="middle">content</text>
<path class="e" d="M110 154 H363" marker-end="url(#ah)"/>
<circle cx="141" cy="144" r="9" fill="#525a7c"/>
<text class="t-num" x="141" y="147.5" text-anchor="middle">1</text>
<text class="t-edge" x="237.5" y="148" text-anchor="middle">POST /api/publish + token</text>
<rect class="note" x="270.4" y="178" width="189.2" height="28" rx="8"/>
<circle cx="286.4" cy="192" r="9" fill="#0e7686"/>
<text class="t-num" x="286.4" y="195.5" text-anchor="middle">2</text>
<text class="t-edge path" x="302.4" y="196" text-anchor="start">WAF rules + rate limit</text>
<path class="e" d="M365 242 H618" marker-end="url(#ah)"/>
<circle cx="409.2" cy="232" r="9" fill="#525a7c"/>
<text class="t-num" x="409.2" y="235.5" text-anchor="middle">3</text>
<text class="t-edge" x="492.5" y="236" text-anchor="middle">internal ALB → Lambda</text>
<rect class="note" x="512.2" y="266" width="215.6" height="28" rx="8"/>
<circle cx="528.2" cy="280" r="9" fill="#0e7686"/>
<text class="t-num" x="528.2" y="283.5" text-anchor="middle">4</text>
<text class="t-edge path" x="544.2" y="284" text-anchor="start">verify JWT · require admin</text>
<path class="e" d="M620 330 H873" marker-end="url(#ah)"/>
<circle cx="667.5" cy="320" r="9" fill="#525a7c"/>
<text class="t-num" x="667.5" y="323.5" text-anchor="middle">5</text>
<text class="t-edge" x="747.5" y="324" text-anchor="middle">read published items</text>
<path class="e" d="M620 374 H1128" marker-end="url(#ah)"/>
<circle cx="768.6" cy="364" r="9" fill="#525a7c"/>
<text class="t-num" x="768.6" y="367.5" text-anchor="middle">6</text>
<text class="t-edge" x="875" y="368" text-anchor="middle">write releases/&lt;time&gt;/*.json</text>
<path class="e" d="M620 418 H1128" marker-end="url(#ah)"/>
<circle cx="778.5" cy="408" r="9" fill="#525a7c"/>
<text class="t-num" x="778.5" y="411.5" text-anchor="middle">7</text>
<text class="t-edge" x="875" y="412" text-anchor="middle">swap current.json pointer</text>
<path class="e" d="M620 462 H873" marker-end="url(#ah)"/>
<circle cx="660.9" cy="452" r="9" fill="#525a7c"/>
<text class="t-num" x="660.9" y="455.5" text-anchor="middle">8</text>
<text class="t-edge" x="747.5" y="456" text-anchor="middle">record release + audit</text>
<path class="e" d="M620 506 H367" marker-end="url(#ah)"/>
<circle cx="402.6" cy="496" r="9" fill="#525a7c"/>
<text class="t-num" x="402.6" y="499.5" text-anchor="middle">9</text>
<text class="t-edge" x="492.5" y="500" text-anchor="middle">invalidate current.json</text>
<path class="e ret" d="M620 550 H112" marker-end="url(#ah)"/>
<circle cx="321.3" cy="540" r="9" fill="#525a7c"/>
<text class="t-num" x="321.3" y="543.5" text-anchor="middle">10</text>
<text class="t-edge" x="365" y="544" text-anchor="middle">published</text>
<text class="t-edge path" x="40" y="614" text-anchor="start">Roll back = point current.json at an earlier release. Visitors see changes within about a minute.</text>
</svg>
