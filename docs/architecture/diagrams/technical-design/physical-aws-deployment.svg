<text class="t-eye" x="650" y="428" text-anchor="middle">CONTENT DATABASE</text>
<text class="t-name" x="650" y="447" text-anchor="middle">DynamoDB</text>
<text class="t-sub" x="650" y="464" text-anchor="middle">on-demand · PITR</text>
<rect class="n-comp" x="850" y="410" width="170" height="64" rx="14"/>
<text class="t-eye" x="935" y="428" text-anchor="middle">MEDIA PROCESSOR</text>
<text class="t-name" x="935" y="447" text-anchor="middle">Lambda</text>
<text class="t-sub" x="935" y="464" text-anchor="middle">+ MediaConvert</text>
</g>
<text class="t-edge" x="40" y="676" text-anchor="start">Regional services run in ap-south-1 (Mumbai). CloudFront, ACM certificates (us-east-1) and Route 53 are global.</text>
</svg>
