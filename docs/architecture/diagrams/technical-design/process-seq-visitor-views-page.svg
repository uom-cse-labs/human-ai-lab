<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 682" width="1240" height="682" role="img" aria-label="A visitor opens a news article">
<title>A visitor opens a news article</title>
<style>
  .n-comp{fill:#ffffff;stroke:#c7cbdc;stroke-width:1.2}
  .n-store{fill:#e9ebf4;stroke:#c7cbdc;stroke-width:1.2}
  .n-person{fill:#eef0f7;stroke:#c7cbdc;stroke-width:1.2}
  .n-ext{fill:#ffffff;stroke:#c7cbdc;stroke-width:1.2;stroke-dasharray:5 4}
  .t-name{fill:#0d0f2b;font:600 13.5px 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif}
  .t-sub{fill:#525a7c;font:400 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-eye{fill:#525a7c;font:500 9.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;letter-spacing:.1em}
  .t-edge{fill:#525a7c;font:500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-edge.path{fill:#0e7686}
  .t-bound{fill:#525a7c;font:500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;letter-spacing:.08em}
  .t-title{fill:#151b54;font:700 17px 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif}
  .t-band{fill:#0d0f2b;font:400 11.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .t-num{fill:#ffffff;font:600 10px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}
  .e{fill:none;stroke:#525a7c;stroke-width:1.4}
  .e.path{stroke:#0e7686;stroke-width:2}
  .e.ret{stroke-dasharray:5 4}
  .life{stroke:#c7cbdc;stroke-width:1.2;stroke-dasharray:4 5}
  .bound{fill:none;stroke:#151b54;stroke-opacity:.45;stroke-width:1.3;stroke-dasharray:7 5}
  .band{fill:#f3f4fa;stroke:#c7cbdc;stroke-width:1;stroke-dasharray:4 4}
  .note{fill:#e3f3f5;stroke:#0e7686;stroke-width:1}
  .ah{fill:#525a7c} .ah.path{fill:#0e7686}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker>
  <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah path"/></marker>
  <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#ffffff" stroke="#525a7c" stroke-width="1.2"/></marker>
  <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 z" fill="#525a7c"/></marker>
  <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#525a7c" stroke-width="1.4"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1239" height="681" rx="20" fill="#ffffff" stroke="#dfe2ec"/>
<text class="t-title" x="40" y="42" text-anchor="start">A visitor opens a news article</text>
<line class="life" x1="110" y1="114" x2="110" y2="624"/>
<rect class="n-person" x="35" y="64" width="150" height="50" rx="25"/>
<text class="t-name" x="110" y="86" text-anchor="middle">Browser</text>
<text class="t-sub" x="110" y="102" text-anchor="middle">visitor</text>
<line class="life" x1="314" y1="114" x2="314" y2="624"/>
<rect class="n-comp" x="239" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="314" y="86" text-anchor="middle">CloudFront</text>
<text class="t-sub" x="314" y="102" text-anchor="middle">public</text>
<line class="life" x1="518" y1="114" x2="518" y2="624"/>
<rect class="n-comp" x="443" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="518" y="86" text-anchor="middle">CF Function</text>
<text class="t-sub" x="518" y="102" text-anchor="middle">SPA rewrite</text>
<line class="life" x1="722" y1="114" x2="722" y2="624"/>
<rect class="n-store" x="647" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="722" y="86" text-anchor="middle">S3</text>
<text class="t-sub" x="722" y="102" text-anchor="middle">web-public</text>
<line class="life" x1="926" y1="114" x2="926" y2="624"/>
<rect class="n-store" x="851" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="926" y="86" text-anchor="middle">S3</text>
<text class="t-sub" x="926" y="102" text-anchor="middle">content</text>
<line class="life" x1="1130" y1="114" x2="1130" y2="624"/>
<rect class="n-store" x="1055" y="64" width="150" height="50" rx="12"/>
<text class="t-name" x="1130" y="86" text-anchor="middle">S3</text>
<text class="t-sub" x="1130" y="102" text-anchor="middle">media</text>
<path class="e path" d="M110 154 H312" marker-end="url(#ahp)"/>
<circle cx="145.2" cy="144" r="9" fill="#0e7686"/>
<text class="t-num" x="145.2" y="147.5" text-anchor="middle">1</text>
<text class="t-edge path" x="212" y="148" text-anchor="middle">GET /news/&lt;slug&gt;</text>
<path class="e path" d="M314 198 H516" marker-end="url(#ahp)"/>
<circle cx="355.8" cy="188" r="9" fill="#0e7686"/>
<text class="t-num" x="355.8" y="191.5" text-anchor="middle">2</text>
<text class="t-edge path" x="416" y="192" text-anchor="middle">viewer request</text>
<path class="e path ret" d="M518 242 H316" marker-end="url(#ahp)"/>
<circle cx="332.7" cy="232" r="9" fill="#0e7686"/>
<text class="t-num" x="332.7" y="235.5" text-anchor="middle">3</text>
<text class="t-edge path" x="416" y="236" text-anchor="middle">rewrite → /index.html</text>
<path class="e path" d="M314 286 H720" marker-end="url(#ahp)"/>
<circle cx="395.1" cy="276" r="9" fill="#0e7686"/>
<text class="t-num" x="395.1" y="279.5" text-anchor="middle">4</text>
<text class="t-edge path" x="518" y="280" text-anchor="middle">GET /index.html (cache miss only)</text>
<path class="e path ret" d="M314 330 H112" marker-end="url(#ahp)"/>
<circle cx="135.3" cy="320" r="9" fill="#0e7686"/>
<text class="t-num" x="135.3" y="323.5" text-anchor="middle">5</text>
<text class="t-edge path" x="212" y="324" text-anchor="middle">index.html + assets</text>
<path class="e path" d="M110 374 H312" marker-end="url(#ahp)"/>
<circle cx="115.5" cy="364" r="9" fill="#0e7686"/>
<text class="t-num" x="115.5" y="367.5" text-anchor="middle">6</text>
<text class="t-edge path" x="212" y="368" text-anchor="middle">GET /content/current.json</text>
<path class="e path" d="M314 418 H924" marker-end="url(#ahp)"/>
<circle cx="510.29999999999995" cy="408" r="9" fill="#0e7686"/>
<text class="t-num" x="510.29999999999995" y="411.5" text-anchor="middle">7</text>
<text class="t-edge path" x="620" y="412" text-anchor="middle">cache miss only · cached 30 s</text>
<path class="e path" d="M110 462 H312" marker-end="url(#ahp)"/>
<circle cx="108.9" cy="452" r="9" fill="#0e7686"/>
<text class="t-num" x="108.9" y="455.5" text-anchor="middle">8</text>
<text class="t-edge path" x="212" y="456" text-anchor="middle">GET releases/&lt;id&gt;/news.json</text>
<path class="e path" d="M314 506 H924" marker-end="url(#ahp)"/>
<circle cx="503.70000000000005" cy="496" r="9" fill="#0e7686"/>
<text class="t-num" x="503.70000000000005" y="499.5" text-anchor="middle">9</text>
<text class="t-edge path" x="620" y="500" text-anchor="middle">cache miss only · cached 1 year</text>
<path class="e path" d="M110 550 H312" marker-end="url(#ahp)"/>
<circle cx="118.80000000000001" cy="540" r="9" fill="#0e7686"/>
<text class="t-num" x="118.80000000000001" y="543.5" text-anchor="middle">10</text>
<text class="t-edge path" x="212" y="544" text-anchor="middle">GET /media/&lt;id&gt;/960.webp</text>
<path class="e path" d="M314 594 H1128" marker-end="url(#ahp)"/>
<circle cx="605.7" cy="584" r="9" fill="#0e7686"/>
<text class="t-num" x="605.7" y="587.5" text-anchor="middle">11</text>
<text class="t-edge path" x="722" y="588" text-anchor="middle">cache miss only · cached 1 year</text>
<text class="t-edge path" x="40" y="658" text-anchor="start">No Lambda and no database on the visitor path.</text>
</svg>
