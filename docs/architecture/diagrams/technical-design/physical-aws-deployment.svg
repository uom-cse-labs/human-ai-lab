<path class="e path" d="M180 64 L180 114" marker-end="url(#ahp)"/>
<text class="t-edge path" x="188" y="94" text-anchor="start">HTTPS</text>
<path class="e path" d="M110 180 L110 408" marker-end="url(#ahp)"/>
<text class="t-edge path" x="118" y="262" text-anchor="start">/media/*</text>
